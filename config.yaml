timezone: Asia/Shanghai
sources_file: sources.yaml
expected_company_count: 101

search:
  enabled: true
  provider: google_news_rss
  endpoint: https://news.google.com/rss/search
  country: CN
  language: zh-hans
  results_per_query: 10
  daily_query_budget: 20
  query_delay_seconds: 2.0
  cohort_terms: ["2027届", "27届"]
  recruitment_terms:
    - 校园招聘
    - 秋招
    - 春招
    - 提前批
  source_queries:
    - ""
    - "site:nowcoder.com"
    - "site:yingjiesheng.com"
    - "site:ncss.cn"
    - "site:iguopin.com"
    - "site:edu.cn 就业"
  extra_keywords: []
  exclude_terms: ["2026届", "26届", "2025届", "25届", "社会招聘", "社招"]

crawler:
  timeout_seconds: 12
  max_page_bytes: 2000000
  max_results_per_run: 120
  page_delay_seconds: 0.4
  user_agent: "CampusJobs2027/0.1 (+public recruitment information aggregator)"
  respect_robots_txt: true
  recheck_limit: 80
  min_source_success_ratio: 0.20
  source_workers: 8

output:
  data_file: data/jobs.json
  leads_file: data/leads.json
  health_file: data/health.json
  csv_file: docs/jobs.csv
  site_dir: docs
  site_title: "2027届央国企与外企校园招聘"
  public_base_url: "https://luweitao31-lgtm.github.io/campus-jobs-2027/"
