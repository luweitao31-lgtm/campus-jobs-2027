timezone: Asia/Shanghai

search:
  provider: google_news_rss
  endpoint: https://news.google.com/rss/search
  country: CN
  language: zh-hans
  results_per_query: 10
  daily_query_budget: 20
  query_delay_seconds: 2.0
  cohort_terms: ["2027届", "27届"]
  recruitment_terms:
    - 校园招聘
    - 秋招
    - 春招
    - 提前批
    - 暑期实习 转正
    - 日常实习 留用
  source_queries:
    - ""
    - "site:nowcoder.com"
    - "site:yingjiesheng.com"
    - "site:ncss.cn"
    - "site:iguopin.com"
    - "site:edu.cn 就业"
  extra_keywords: []
  exclude_terms: ["2026届", "26届", "2025届", "25届", "社会招聘", "社招"]

crawler:
  timeout_seconds: 12
  max_page_bytes: 2000000
  max_results_per_run: 120
  page_delay_seconds: 0.4
  user_agent: "CampusJobs2027/0.1 (+public recruitment information aggregator)"
  respect_robots_txt: true
  recheck_limit: 80

verification:
  trusted_ats_domains:
    - jobs.bytedance.com
    - join.qq.com
    - career.alibaba.com
    - campus.alibaba.com
    - talent.baidu.com
    - career.huawei.com
    - jobs.tiktok.com
    - zhaopin.jd.com
    - campus.jd.com
    - meituan.jobs
    - careers.tencent.com
    - campus.netease.com
    - job.xiaomi.com
    - careers.microsoft.com
    - careers.google.com
    - jobs.apple.com
    - career.oppo.com
    - hr.vivo.com
    - we.dji.com
  aggregator_domains:
    - nowcoder.com
    - yingjiesheng.com
    - ncss.cn
    - iguopin.com
    - zhaopin.com
    - 51job.com
    - liepin.com
    - bosszhipin.com
  company_domains:
    字节跳动: [jobs.bytedance.com, jobs.tiktok.com]
    腾讯: [join.qq.com, careers.tencent.com]
    阿里巴巴: [career.alibaba.com, campus.alibaba.com]
    百度: [talent.baidu.com]
    华为: [career.huawei.com]
    京东: [zhaopin.jd.com, campus.jd.com]
    美团: [meituan.jobs]
    网易: [campus.netease.com]
    小米: [job.xiaomi.com]
    微软: [careers.microsoft.com]
    谷歌: [careers.google.com]
    苹果: [jobs.apple.com]
    OPPO: [career.oppo.com]
    vivo: [hr.vivo.com]
    大疆: [we.dji.com]

output:
  data_file: data/jobs.json
  csv_file: docs/jobs.csv
  site_dir: docs
  site_title: "2027届校园招聘信息"
  public_base_url: "https://luweitao31-lgtm.github.io/campus-jobs-2027/"

mail:
  enabled: true
  subject_prefix: "[2027届校招]"
  use_tls: true
  use_ssl: false
