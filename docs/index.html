<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日自动更新的2027届校园招聘、提前批及可转正实习信息">
  <title>2027届校园招聘信息</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --muted:#667085; --line:#e4e7ec; --brand:#175cd3; --soft:#eff8ff; --ok:#067647; --warn:#b54708; --dead:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f8fafc; }
    main { max-width:1440px; margin:auto; padding:32px 24px 64px; }
    h1 { margin:0 0 8px; font-size:clamp(28px,4vw,44px); letter-spacing:-.03em; }
    .subtitle,.updated,.empty { color:var(--muted); }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(120px,1fr)); gap:12px; margin:24px 0; }
    .stat,.panel { background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 3px #10182810; }
    .stat { padding:16px; }.stat b { display:block; font-size:26px; }.stat span { color:var(--muted); font-size:13px; }
    .panel { padding:16px; }
    .filters { display:grid; grid-template-columns:2fr repeat(4,1fr); gap:10px; margin-bottom:16px; }
    input,select { width:100%; min-height:42px; padding:9px 11px; border:1px solid #d0d5dd; border-radius:9px; background:white; color:var(--ink); }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; color:var(--muted); }
    .download,.apply { color:white; background:var(--brand); text-decoration:none; padding:8px 12px; border-radius:8px; display:inline-block; white-space:nowrap; }
    .table-wrap { overflow:auto; } table { border-collapse:collapse; width:100%; min-width:1050px; }
    th,td { padding:12px 10px; border-top:1px solid var(--line); text-align:left; vertical-align:top; font-size:14px; }
    th { color:#475467; font-size:12px; text-transform:uppercase; position:sticky; top:0; background:white; }
    .company { font-weight:700; }.job-title { min-width:240px; }.summary { color:var(--muted); margin-top:5px; max-width:420px; line-height:1.5; }
    .badge { display:inline-block; border-radius:999px; padding:3px 8px; font-size:12px; background:#f2f4f7; white-space:nowrap; }
    .verified { color:var(--ok); background:#ecfdf3; }.unverified { color:var(--warn); background:#fffaeb; }.expired { color:var(--dead); background:#fef3f2; }
    .today { outline:2px solid #84caff; outline-offset:-2px; }.source { color:var(--brand); }.hidden { display:none; }
    footer { color:var(--muted); margin-top:18px; font-size:13px; line-height:1.6; }
    @media(max-width:900px){ main{padding:22px 12px 40px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1} }
  </style>
</head>
<body><main>
  <h1>2027届校园招聘信息</h1>
  <div class="subtitle">全国全岗位 · 校招 / 提前批 / 明确可转正实习</div>
  <div class="updated">最近生成：2026-08-25 00:53:05 CST</div>
  <section class="stats">
    <div class="stat"><b>0</b><span>累计收录</span></div>
    <div class="stat"><b>0</b><span>官网已验证</span></div>
    <div class="stat"><b>0</b><span>今日新增</span></div>
    <div class="stat"><b>0</b><span>招聘中</span></div>
  </section>
  <section class="panel">
    <div class="filters">
      <input id="keyword" type="search" placeholder="搜索公司、岗位、城市或摘要">
      <select id="city"><option value="">全部城市</option></select>
      <select id="category"><option value="">全部类别</option></select>
      <select id="type"><option value="">全部类型</option></select>
      <select id="verification"><option value="">全部验证状态</option><option value="verified">官网已验证</option><option value="unverified">待核验</option></select>
    </div>
    <div class="toolbar"><span>当前显示 <b id="visible-count">0</b> 条</span><a class="download" href="jobs.csv">下载 CSV</a></div>
    <div class="table-wrap"><table>
      <thead><tr><th>企业</th><th>岗位信息</th><th>城市 / 类别</th><th>招聘类型</th><th>来源</th><th>验证与状态</th><th>投递</th></tr></thead>
      <tbody id="jobs">
      
      </tbody>
    </table></div>
    <p id="empty" class="empty">没有符合当前筛选条件的记录。</p>
  </section>
  <footer>“官网已验证”表示链接域名符合配置的企业招聘官网或可信 ATS；“待核验”仅作为公开线索，请在投递前自行确认。本站不绕过登录或访问限制，也不收集求职者个人信息。</footer>
</main>
<script>
  const rows=[...document.querySelectorAll('.job-row')];
  const controls=['keyword','city','category','type','verification'].map(id=>document.getElementById(id));
  function options(id,key){const select=document.getElementById(id);[...new Set(rows.map(r=>r.dataset[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});}
  options('city','city'); options('category','category'); options('type','type');
  function filter(){const [q,city,cat,type,verified]=controls.map(c=>c.value.toLowerCase());let count=0;rows.forEach(r=>{const show=(!q||r.dataset.search.includes(q))&&(!city||r.dataset.city.toLowerCase()===city)&&(!cat||r.dataset.category.toLowerCase()===cat)&&(!type||r.dataset.type.toLowerCase()===type)&&(!verified||r.dataset.verification===verified);r.classList.toggle('hidden',!show);if(show)count++;});document.getElementById('visible-count').textContent=count;document.getElementById('empty').classList.toggle('hidden',count!==0);}
  controls.forEach(c=>c.addEventListener(c.tagName==='INPUT'?'input':'change',filter));
</script></body></html>
