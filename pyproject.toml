[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-jobs-2027"
version = "0.1.0"
description = "每日聚合并核验 2027 届校园招聘信息"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "responses>=0.25,<1"]

[project.scripts]
campus-jobs = "campus_jobs.cli:main"

[tool.setuptools.packages.find]
include = ["campus_jobs*"]

[tool.setuptools.package-data]
campus_jobs = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
